# Window rules for the Clawd Tank simulator on Hyprland (Omarchy).
#
# The simulator window is borderless, so Hyprland would otherwise tile it into your layout.
# Copy the block that matches your Hyprland version into a file that hyprland.conf sources
# (in Omarchy: ~/.config/hypr/), then reload with `hyprctl reload`.
# Check your version with `hyprctl version`. The window title is "Clawd Tank Simulator";
# run `hyprctl clients` if you would rather match on class.
#
# Reference: https://wiki.hypr.land/configuring/core/rules/window-rules/

# --- Hyprland 0.53 and newer -------------------------------------------------
windowrule = float on, match:title ^(Clawd Tank Simulator)$
windowrule = pin on,   match:title ^(Clawd Tank Simulator)$

# --- Hyprland older than 0.53 (use these instead of the two lines above) -----
# windowrulev2 = float, title:^(Clawd Tank Simulator)$
# windowrulev2 = pin,   title:^(Clawd Tank Simulator)$

# Optional: pin it to a corner (see the wiki for `size` and `move` syntax in your version).
